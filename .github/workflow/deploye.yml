name: Deploy Atomic AI to AWS

on:
  push:
    branches:
    - main
  workflow_dispatch:


permissions:
  contents: read

concurrency:
  group: atomic-ai-production
  cancel-in-progress: true

env:
  AWS_REGION: us-east-1

  S3_BUCKET: atomic-ai-frontend-764847372158-us-east-1-an
  CLOUDFRONT_DISTRIBUTION_ID: E2F7KW3768U7AQ

  ECS_CLUSTER: atomic-ai-cluster

  GATEWAY_ECR_REPOSITORY: gateway
  AUTH_ECR_REPOSITORY: auth-service
  CHAT_ECR_REPOSITORY: chat-service
  AGENT_ECR_REPOSITORY: agent-service

  GATEWAY_ECS_SERVICE: gateway-service
  AUTH_ECS_SERVICE: auth-service
  CHAT_ECS_SERVICE: chat-service
  AGENT_ECS_SERVICE: agent-service

jobs:
  frontend:
    name: Deploy frontend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Client

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: npm
        cache-dependency-path: Client/package-lock.json

    - name: Install dependencies
      run: npm ci

    - name: Build frontend
      run: npm run build
      env:
        VITE_SERVER_URL: /api/v1

    - name: Verify production bundle
      shell: bash
      run: |
        if grep -R "localhost:8000" dist/assets; then
          echo "Production bundle still contains localhost:8000"
          exit 1
        fi

        if grep -R "/public/logo.png" dist/assets; then
          echo "Production bundle still contains /public/logo.png"
          exit 1
        fi

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v6
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Upload frontend to S3
      run: |
        aws s3 sync dist "s3://${S3_BUCKET}" --delete

    - name: Invalidate CloudFront cache
      run: |
        aws cloudfront create-invalidation \
          --distribution-id "${CLOUDFRONT_DISTRIBUTION_ID}" \
          --paths "/*"

  backend:
    name: Deploy ${{ matrix.name }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
        - name: gateway
          context: Server
          dockerfile: Server/gateway/Dockerfile
          repository_env: GATEWAY_ECR_REPOSITORY
          service_env: GATEWAY_ECS_SERVICE

        - name: auth
          context: Server
          dockerfile: Server/services/auth/Dockerfile
          repository_env: AUTH_ECR_REPOSITORY
          service_env: AUTH_ECS_SERVICE

        - name: chat
          context: Server
          dockerfile: Server/services/chat/Dockerfile
          repository_env: CHAT_ECR_REPOSITORY
          service_env: CHAT_ECS_SERVICE

        - name: agent
          context: Server
          dockerfile: Server/services/agent/Dockerfile
          repository_env: AGENT_ECR_REPOSITORY
          service_env: AGENT_ECS_SERVICE

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v6
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: Resolve service variables
      id: vars
      shell: bash
      run: |
        case "${{ matrix.name }}" in
          gateway)
            echo "repository=${GATEWAY_ECR_REPOSITORY}" >> "$GITHUB_OUTPUT"
            echo "service=${GATEWAY_ECS_SERVICE}" >> "$GITHUB_OUTPUT"
            ;;
          auth)
            echo "repository=${AUTH_ECR_REPOSITORY}" >> "$GITHUB_OUTPUT"
            echo "service=${AUTH_ECS_SERVICE}" >> "$GITHUB_OUTPUT"
            ;;
          chat)
            echo "repository=${CHAT_ECR_REPOSITORY}" >> "$GITHUB_OUTPUT"
            echo "service=${CHAT_ECS_SERVICE}" >> "$GITHUB_OUTPUT"
            ;;
          agent)
            echo "repository=${AGENT_ECR_REPOSITORY}" >> "$GITHUB_OUTPUT"
            echo "service=${AGENT_ECS_SERVICE}" >> "$GITHUB_OUTPUT"
            ;;
          *)
            echo "Unknown service"
            exit 1
            ;;
        esac

    - name: Build and push Docker image
      id: build-image
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        ECR_REPOSITORY: ${{ steps.vars.outputs.repository }}
        IMAGE_TAG: ${{ github.sha }}
      run: |
        IMAGE_URI="${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"

        docker build \
          --file "${{ matrix.dockerfile }}" \
          --tag "${IMAGE_URI}" \
          "${{ matrix.context }}"

        docker push "${IMAGE_URI}"

        docker tag \
          "${IMAGE_URI}" \
          "${ECR_REGISTRY}/${ECR_REPOSITORY}:latest"

        docker push \
          "${ECR_REGISTRY}/${ECR_REPOSITORY}:latest"

        echo "image=${IMAGE_URI}" >> "$GITHUB_OUTPUT"

    - name: Force ECS service deployment
      env:
        ECS_SERVICE: ${{ steps.vars.outputs.service }}
      run: |
        aws ecs update-service \
          --cluster "${ECS_CLUSTER}" \
          --service "${ECS_SERVICE}" \
          --force-new-deployment

    - name: Wait for ECS service stability
      env:
        ECS_SERVICE: ${{ steps.vars.outputs.service }}
      run: |
        aws ecs wait services-stable \
          --cluster "${ECS_CLUSTER}" \
          --services "${ECS_SERVICE}"

    - name: Show service status
      env:
        ECS_SERVICE: ${{ steps.vars.outputs.service }}
      run: |
        aws ecs describe-services \
          --cluster "${ECS_CLUSTER}" \
          --services "${ECS_SERVICE}" \
          --query "services[0].{service:serviceName,status:status,running:runningCount,desired:desiredCount,taskDefinition:taskDefinition}" \
          --output table
