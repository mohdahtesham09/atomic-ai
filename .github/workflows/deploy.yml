name: Deploy Atomic AI to AWS

on:
  push:
    branches:
    - main
  workflow_dispatch:


permissions:
  contents: read

concurrency:
  group: atomic-ai-production
  cancel-in-progress: true

env:
  AWS_REGION: us-east-1
  S3_BUCKET: atomic-ai-frontend-764847372158-us-east-1-an
  CLOUDFRONT_DISTRIBUTION_ID: E2F7KW3768U7AQ
  ECS_CLUSTER: backend

jobs:
  # =====================================================
  # FRONTEND: React/Vite -> S3 -> CloudFront
  # =====================================================
  frontend:
    name: Deploy frontend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Client

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: npm
        cache-dependency-path: Client/package-lock.json

    - name: Install dependencies
      run: npm ci

    - name: Build frontend
      run: npm run build
      env:
        VITE_SERVER_URL: /api/v1
        VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
        VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
        VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
        VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
        VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
        VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}

    - name: Verify production bundle
      shell: bash
      run: |
        if grep -R "localhost:8000" dist/assets; then
          echo "ERROR: Production bundle contains localhost:8000"
          exit 1
        fi

        if grep -R "/public/logo.png" dist/assets; then
          echo "ERROR: Production bundle contains /public/logo.png"
          exit 1
        fi

        echo "Frontend bundle verification passed."

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v6
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Upload frontend to S3
      shell: bash
      run: |
        aws s3 sync dist "s3://${S3_BUCKET}" \
          --delete \
          --region "${AWS_REGION}"

    - name: Invalidate CloudFront cache
      shell: bash
      run: |
        aws cloudfront create-invalidation \
          --distribution-id "${CLOUDFRONT_DISTRIBUTION_ID}" \
          --paths "/*"

  # =====================================================
  # BACKEND: Docker -> ECR -> ECS
  # =====================================================
  backend:
    name: Deploy ${{ matrix.name }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
        - name: gateway
          ecr_repository: gateway
          ecs_service: gateway-service
          dockerfile: Server/gateway/Dockerfile
          context: Server

        - name: auth
          ecr_repository: auth-service
          ecs_service: auth-service
          dockerfile: Server/services/auth/Dockerfile
          context: Server

        - name: chat
          ecr_repository: chat-service
          ecs_service: chat-service
          dockerfile: Server/services/chat/Dockerfile
          context: Server

        - name: agent
          ecr_repository: agent-service
          ecs_service: agent-service
          dockerfile: Server/services/agent/Dockerfile
          context: Server

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v6
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Verify ECS cluster
      shell: bash
      run: |
        STATUS=$(aws ecs describe-clusters \
          --clusters "${ECS_CLUSTER}" \
          --region "${AWS_REGION}" \
          --query "clusters[0].status" \
          --output text)

        if [ "${STATUS}" != "ACTIVE" ]; then
          echo "ERROR: ECS cluster '${ECS_CLUSTER}' not found or not active."
          exit 1
        fi

        echo "ECS cluster '${ECS_CLUSTER}' is active."

    - name: Verify ECS service
      shell: bash
      run: |
        SERVICE_STATUS=$(aws ecs describe-services \
          --cluster "${ECS_CLUSTER}" \
          --services "${{ matrix.ecs_service }}" \
          --region "${AWS_REGION}" \
          --query "services[0].status" \
          --output text)

        if [ "${SERVICE_STATUS}" != "ACTIVE" ]; then
          echo "ERROR: ECS service '${{ matrix.ecs_service }}' not found."
          echo "Available services in cluster '${ECS_CLUSTER}':"

          aws ecs list-services \
            --cluster "${ECS_CLUSTER}" \
            --region "${AWS_REGION}" \
            --query "serviceArns[]" \
            --output table

          exit 1
        fi

        echo "ECS service '${{ matrix.ecs_service }}' is active."

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: Build and push Docker image
      shell: bash
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        ECR_REPOSITORY: ${{ matrix.ecr_repository }}
        IMAGE_TAG: ${{ github.sha }}
      run: |
        IMAGE_SHA="${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"
        IMAGE_LATEST="${ECR_REGISTRY}/${ECR_REPOSITORY}:latest"

        echo "Building image: ${IMAGE_SHA}"

        docker build \
          --file "${{ matrix.dockerfile }}" \
          --tag "${IMAGE_SHA}" \
          --tag "${IMAGE_LATEST}" \
          "${{ matrix.context }}"

        echo "Pushing commit image..."
        docker push "${IMAGE_SHA}"

        echo "Pushing latest image..."
        docker push "${IMAGE_LATEST}"

        echo "Docker image pushed successfully."

    - name: Force ECS service deployment
      shell: bash
      run: |
        echo "Deploying ${{ matrix.ecs_service }}..."

        aws ecs update-service \
          --cluster "${ECS_CLUSTER}" \
          --service "${{ matrix.ecs_service }}" \
          --force-new-deployment \
          --region "${AWS_REGION}" \
          --output json

    - name: Wait for ECS service stability
      timeout-minutes: 5
      continue-on-error: true
      shell: bash
      run: |
        echo "Waiting up to 5 minutes for '${{ matrix.ecs_service }}'..."

        aws ecs wait services-stable \
          --cluster "${ECS_CLUSTER}" \
          --services "${{ matrix.ecs_service }}" \
          --region "${AWS_REGION}"

        echo "${{ matrix.ecs_service }} is stable."

    - name: Show ECS service status
      if: always()
      shell: bash
      run: |
        echo "Current status of ${{ matrix.ecs_service }}:"

        aws ecs describe-services \
          --cluster "${ECS_CLUSTER}" \
          --services "${{ matrix.ecs_service }}" \
          --region "${AWS_REGION}" \
          --query "services[0].{
            Service:serviceName,
            Status:status,
            Running:runningCount,
            Pending:pendingCount,
            Desired:desiredCount,
            TaskDefinition:taskDefinition
          }" \
          --output table
